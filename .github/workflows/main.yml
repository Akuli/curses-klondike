on:
  push:
    branches:
      - main
  pull_request:

jobs:
  compile_and_test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - name: Check that Jou version is specified consistently
      run: |
        git grep -no --color $(cat jou_version.txt)  # this is only for debugging
        n=$(git grep -o $(cat jou_version.txt) | wc -l)
        if [ $n != 4 ]; then
          echo "Error: Jou version should be mentioned only in README (3 times) and jou_version.txt (once)"
          exit 1
        fi

    - name: Install dependencies (mostly Jou dependencies)
      run: sudo apt install -y libncurses-dev llvm-19-dev clang-19 make valgrind

    - name: Download and compile Jou
      run: git clone --branch $(cat jou_version.txt) https://github.com/Akuli/jou && cd jou && make -j2

    - name: Run tests
      run: jou/joutest --verbose

    # TODO: enable this when implemented in joutest
    #- name: Run tests with valgrind
    #  run: jou/joutest --verbose --valgrind

    - name: Compile main executable
      run: jou/jou -o cursesklon src/main.jou

    - name: Run with --help option
      run: ./cursesklon --help
